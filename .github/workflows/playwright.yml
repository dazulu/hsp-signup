name: Sign up to HSP training

on:
  workflow_dispatch:
    inputs:
      sport:
        description: "Select sport to book"
        required: true
        default: "hurling"
        type: choice
        options:
          - hurling
          - football

  repository_dispatch:
    types: [book-sport]

jobs:
  signup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Mask credentials
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "::add-mask::${{ github.event.client_payload.hsp_email }}"
          echo "::add-mask::${{ github.event.client_payload.hsp_password }}"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright script
        run: npx playwright test
        env:
          HSP_EMAIL: ${{ github.event.client_payload.hsp_email || secrets.HSP_EMAIL }}
          HSP_PASSWORD: ${{ github.event.client_payload.hsp_password || secrets.HSP_PASSWORD }}
          SELECTED_SPORT: ${{ github.event.inputs.sport || github.event.client_payload.sport || 'hurling' }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
