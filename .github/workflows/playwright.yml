name: Sign up to HSP training

on:
  repository_dispatch:
    types: [book-sport]

run-name: "book-sport-${{ github.event.client_payload.correlation_id }}"

permissions: {}

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Mask credentials
        run: |
          echo "::add-mask::${{ github.event.client_payload.hsp_email }}"
          echo "::add-mask::${{ github.event.client_payload.hsp_password }}"

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright script
        run: npx playwright test
        env:
          HSP_EMAIL: ${{ github.event.client_payload.hsp_email }}
          HSP_PASSWORD: ${{ github.event.client_payload.hsp_password }}
          SELECTED_SPORT: ${{ github.event.client_payload.sport }}

      - name: Save Playwright browsers cache
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
