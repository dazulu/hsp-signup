name: Sign up to HSP training

on:
  repository_dispatch:
    types: [book-sport]

run-name: "book-sport-${{ github.event.client_payload.correlation_id }}"

permissions: {}

jobs:
  signup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Decrypt and mask credentials
        id: creds
        run: |
          node -e "
            const crypto = require('crypto');
            const key = Buffer.from(process.env.ENCRYPTION_KEY, 'hex');
            function decrypt(b64) {
              const buf = Buffer.from(b64, 'base64');
              const iv = buf.subarray(0, 12);
              const tag = buf.subarray(12, 28);
              const data = buf.subarray(28);
              const d = crypto.createDecipheriv('aes-256-gcm', key, iv);
              d.setAuthTag(tag);
              return Buffer.concat([d.update(data), d.final()]).toString('utf8');
            }
            const email = decrypt(process.env.ENC_EMAIL);
            const password = decrypt(process.env.ENC_PASSWORD);
            console.log('::add-mask::' + email);
            console.log('::add-mask::' + password);
            require('fs').appendFileSync(process.env.GITHUB_ENV,
              'HSP_EMAIL=' + email + '\nHSP_PASSWORD=' + password + '\n');
          "
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ENC_EMAIL: ${{ github.event.client_payload.hsp_email }}
          ENC_PASSWORD: ${{ github.event.client_payload.hsp_password }}

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            playwright
            playwright.config.ts
            package.json
            package-lock.json
            tsconfig.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund --omit=optional

      - name: Restore Playwright browsers cache
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Run Playwright script
        run: npx playwright test
        env:
          HSP_EMAIL: ${{ env.HSP_EMAIL }}
          HSP_PASSWORD: ${{ env.HSP_PASSWORD }}
          SELECTED_SPORT: ${{ github.event.client_payload.sport }}

      - name: Upload auth failure marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: auth-failed
          path: test-results/auth-failed
          if-no-files-found: ignore
          retention-days: 4

      - name: Upload no-membership marker
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: no-membership
          path: test-results/no-membership
          if-no-files-found: ignore
          retention-days: 4

      - name: Save Playwright browsers cache
        if: always() && steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 4
